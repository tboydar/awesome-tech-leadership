name: Weekly link check

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,201,204,206,301,302,303,307,308,403,429
            --exclude '(?i)^mailto:'
            --exclude '^https://x\.com(/|$)'
            --exclude '^https://twitter\.com(/|$)'
            --exclude '^https://www\.twitter\.com(/|$)'
            './**/*.md'
            './catalog/index.json'
          output: lychee-report.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Find open automation-owned link-check issues
        id: last_issue
        uses: actions/github-script@v7
        with:
          script: |
            // Only issues created by THIS workflow carry both the shared
            // 'broken-link' label and the automation-only 'link-check:auto'
            // label; human reports via the issue template never carry the
            // auto marker, so they can never match this query.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'broken-link,link-check:auto',
              state: 'open',
              per_page: 100,
            });
            const numbers = issues
              .filter(i => !i.pull_request
                && i.title.startsWith('broken-link: weekly link check')
                && i.labels.some(l => (l.name ?? l) === 'link-check:auto'))
              .map(i => i.number);
            core.setOutput('numbers', numbers.join(','));
      - name: Close automation-owned issues if all links pass
        if: steps.lychee.outputs.exit_code == '0' && steps.last_issue.outputs.numbers != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBERS: ${{ steps.last_issue.outputs.numbers }}
        with:
          script: |
            const raw = process.env.ISSUE_NUMBERS ?? '';
            const parts = raw.split(',').filter(Boolean);
            if (!parts.every(p => /^[0-9]+$/.test(p))) {
              core.setFailed(`Refusing to act on malformed issue number list: ${raw}`);
              return;
            }
            for (const issue_number of parts.map(Number)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: 'All links resolve again ✅ (weekly link check) — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
      - name: Open issue for broken links
        if: steps.lychee.outputs.exit_code != '0' && steps.last_issue.outputs.numbers == ''
        uses: peter-evans/create-issue-from-file@v3
        with:
          title: "broken-link: weekly link check found dead links"
          content-filepath: lychee-report.md
          labels: broken-link,link-check:auto
