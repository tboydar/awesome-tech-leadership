name: Weekly link check

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            --exclude 'https://x\.com/.*'
            --exclude 'https://twitter\.com/.*'
            './**/*.md'
            './catalog/index.json'
          output: lychee-report.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Find last link-check issue
        id: last_issue
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'broken-link',
              state: 'open',
              per_page: 1,
            });
            core.setOutput('number', issues.data[0]?.number ?? '');
      - name: Close stale link-check issue if all links pass
        if: steps.lychee.outputs.exit_code == '0' && steps.last_issue.outputs.number != ''
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.last_issue.outputs.number }}
        with:
          script: |
            const raw = process.env.ISSUE_NUMBER ?? '';
            if (!/^[0-9]+$/.test(raw)) {
              core.setFailed(`Refusing to act on non-numeric issue number: ${raw}`);
              return;
            }
            const issue_number = parseInt(raw, 10);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: 'All links resolve again ✅ (weekly link check) — closing.',
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              state: 'closed',
              state_reason: 'completed',
            });
      - name: Open issue for broken links
        if: steps.lychee.outputs.exit_code != '0'
        uses: peter-evans/create-issue-from-file@v3
        with:
          title: "broken-link: weekly link check found dead links"
          content-filepath: lychee-report.md
          labels: broken-link
